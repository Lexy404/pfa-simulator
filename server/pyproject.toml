[project]
name = "pfa-server"
version = "0.1.0"
description = "Local server for PFA Simulator: STT -> classifier -> stress engine -> NPC LLM -> TTS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=12",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pfa_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
